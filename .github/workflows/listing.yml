name: Listing

# GitHub のリリースから VCC 用の一覧（index.json）とページを作り、GitHub Pages に公開する。
# リリースのあとに Release から呼ばれる。一覧の作り方を変えたときも動く。手動でも動かせる。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/listing.yml'
      - '.github/scripts/build_listing.py'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  listing:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the listing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/build_listing.py site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
